route:
  receiver: beacon
  group_by: ["alertname", "dag_id", "task_id"]
  group_wait: 5s
  group_interval: 30s
  # Re-notify every minute while an alert keeps firing. beacon-api dedupes on
  # fingerprint + run id, so repeats for the same run are dropped, while a *new*
  # failed run of a DAG whose alert is still firing becomes a new incident.
  repeat_interval: 1m

receivers:
  - name: beacon
    webhook_configs:
      - url: http://beacon-api:8000/webhooks/alertmanager
        send_resolved: true
        max_alerts: 20
