# Maps Airflow's dotted statsd names onto clean Prometheus metrics with labels.
# Timers arrive in milliseconds; statsd-exporter exports them in seconds.
defaults:
  observer_type: histogram
  histogram_options:
    buckets: [0.5, 1, 2.5, 5, 10, 20, 30, 60, 120, 300, 600]
mappings:
  - match: "airflow.scheduler_heartbeat"
    name: "airflow_scheduler_heartbeat"
    match_metric_type: counter

  - match: "airflow.ti_failures"
    name: "airflow_ti_failures"

  - match: "airflow.ti_successes"
    name: "airflow_ti_successes"

  - match: "airflow.ti.finish.*.*.*"
    name: "airflow_ti_finish"
    labels:
      dag_id: "$1"
      task_id: "$2"
      state: "$3"

  - match: "airflow.dagrun.duration.success.*"
    name: "airflow_dagrun_duration"
    labels:
      dag_id: "$1"
      status: "success"

  - match: "airflow.dagrun.duration.failed.*"
    name: "airflow_dagrun_duration"
    labels:
      dag_id: "$1"
      status: "failed"

  - match: "airflow.dag.*.*.duration"
    name: "airflow_task_duration"
    labels:
      dag_id: "$1"
      task_id: "$2"

  - match: "airflow.sla_missed"
    name: "airflow_sla_missed"

  - match: "airflow.dag_processing.import_errors"
    name: "airflow_dag_import_errors"

  - match: "airflow.executor.running_tasks"
    name: "airflow_executor_running_tasks"

  - match: "airflow.executor.queued_tasks"
    name: "airflow_executor_queued_tasks"

  # Drop the remaining per-DAG/per-task dotted noise rather than exporting
  # hundreds of unlabelled series.
  - match: "airflow.*"
    name: "airflow_${1}"
  - match: "."
    match_type: regex
    action: drop
    name: "dropped"
